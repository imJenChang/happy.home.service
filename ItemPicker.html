<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; font-size: 13px; color: #2c3e50; margin: 0; padding: 12px; }
    .target { background: #f1f8e9; border: 1px solid #c5e1a5; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.6; }
    .error { background: #fdecea; border: 1px solid #f5c6cb; color: #a94442; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .tab { flex: 1; padding: 6px 0; text-align: center; border: 1px solid #cfd8dc; border-radius: 6px; cursor: pointer; background: #fff; }
    .tab.active { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #cfd8dc; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    .list { max-height: 300px; overflow-y: auto; border: 1px solid #e0e6ed; border-radius: 8px; }
    .item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #f0f2f4; }
    .item:last-child { border-bottom: none; }
    .item.picked { background: #f1f8e9; }
    .item .name { flex: 1; padding-right: 6px; word-break: break-all; }
    .item .cat { color: #90a4ae; font-size: 11px; margin-left: 4px; }
    .qty { display: flex; align-items: center; gap: 4px; }
    .qty button { width: 24px; height: 24px; border: 1px solid #cfd8dc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 1; }
    .qty span { min-width: 18px; text-align: center; font-weight: bold; }
    .custom { display: flex; gap: 6px; margin-top: 8px; }
    .custom input { margin-bottom: 0; }
    .custom button { white-space: nowrap; }
    .summary { margin-top: 10px; padding: 8px 10px; background: #f8faf9; border: 1px dashed #b0bec5; border-radius: 8px; min-height: 18px; word-break: break-all; }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn { flex: 1; padding: 9px 0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .btn.primary { background: #2e7d32; color: #fff; }
    .btn.secondary { background: #eceff1; color: #37474f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 8px; font-size: 12px; color: #2e7d32; min-height: 16px; }
    .empty { padding: 12px; color: #90a4ae; text-align: center; }
  </style>
</head>
<body>
  <div id="error" class="error" style="display:none"></div>
  <div id="target" class="target" style="display:none"></div>

  <div class="tabs">
    <div class="tab active" data-cat="">全部</div>
    <div class="tab" data-cat="配件">配件</div>
    <div class="tab" data-cat="成品">成品</div>
  </div>
  <input type="text" id="search" placeholder="搜尋品名...">
  <div class="list" id="list"></div>

  <div class="custom">
    <input type="text" id="customName" placeholder="清單沒有的品項（會直接加入已選）">
    <button class="btn secondary" style="flex:0 0 auto; padding: 0 10px;" onclick="addCustom()">加入</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="actions">
    <button class="btn secondary" onclick="load()">讀取目前儲存格</button>
    <button class="btn primary" id="saveBtn" onclick="save()">寫入儲存格</button>
  </div>
  <div class="msg" id="msg"></div>

  <script>
    let items = [];      // 品項清單 [{name, category}]
    let qty = {};        // 品名 -> 數量（保留選取順序）
    let order = [];
    let target = null;
    let category = "";

    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        category = tab.dataset.cat;
        render();
      };
    });
    document.getElementById("search").oninput = render;

    function load() {
      setMsg("讀取中...");
      google.script.run
        .withSuccessHandler(data => {
          items = data.items || [];
          target = data.target;
          qty = {}; order = [];
          const err = document.getElementById("error");
          const tgt = document.getElementById("target");
          if (data.error) {
            err.textContent = data.error; err.style.display = "block"; tgt.style.display = "none";
          } else {
            err.style.display = "none";
            tgt.innerHTML = "分頁：" + esc(target.sheet) + "　第 " + target.row + " 列<br>案件：" +
              esc(target.caseId || "（無編號）") + "　" + esc(target.customer);
            tgt.style.display = "block";
            parseCurrent(target.current);
          }
          if (!items.length) setMsg("「品項清單」分頁目前沒有品項，可先用下方自訂加入。");
          else setMsg("");
          render();
        })
        .withFailureHandler(e => setMsg("讀取失敗：" + e.message, true))
        .getItemPickerData();
    }

    // 解析「品名×2、品名×1」（也接受 x、X、*）
    function parseCurrent(text) {
      String(text || "").split(/[、,，\n]/).map(s => s.trim()).filter(Boolean).forEach(part => {
        const m = part.match(/^(.*?)\s*[×xX*]\s*(\d+)\s*$/);
        const name = (m ? m[1] : part).trim();
        const n = m ? Number(m[2]) : 1;
        if (name) setQty(name, (qty[name] || 0) + n);
      });
    }

    function setQty(name, n) {
      if (n <= 0) {
        delete qty[name];
        order = order.filter(x => x !== name);
      } else {
        if (!(name in qty)) order.push(name);
        qty[name] = n;
      }
    }

    function change(name, delta) {
      setQty(name, (qty[name] || 0) + delta);
      render();
    }

    function addCustom() {
      const input = document.getElementById("customName");
      const name = input.value.replace(/[、,，×*]/g, " ").trim();
      if (!name) return;
      change(name, 1);
      input.value = "";
    }

    function render() {
      const kw = document.getElementById("search").value.trim().toLowerCase();
      const known = new Set(items.map(i => i.name));
      // 已選但不在清單內的品項也要顯示，避免被忽略
      const extra = order.filter(n => !known.has(n)).map(n => ({ name: n, category: "自訂" }));
      const rows = extra.concat(items).filter(i =>
        (!category || i.category === category || i.category === "自訂") &&
        (!kw || i.name.toLowerCase().indexOf(kw) !== -1));
      const list = document.getElementById("list");
      list.innerHTML = rows.length ? "" : '<div class="empty">沒有符合的品項</div>';
      rows.forEach(i => {
        const n = qty[i.name] || 0;
        const div = document.createElement("div");
        div.className = "item" + (n ? " picked" : "");
        div.innerHTML = '<div class="name">' + esc(i.name) + '<span class="cat">' + esc(i.category) + '</span></div>' +
          '<div class="qty"><button>－</button><span>' + n + '</span><button>＋</button></div>';
        const btns = div.querySelectorAll("button");
        btns[0].onclick = () => change(i.name, -1);
        btns[1].onclick = () => change(i.name, 1);
        list.appendChild(div);
      });
      document.getElementById("summary").textContent = summaryText() || "（尚未選擇品項）";
      document.getElementById("saveBtn").disabled = !target;
    }

    function summaryText() {
      return order.map(n => n + "×" + qty[n]).join("、");
    }

    function save() {
      if (!target) return;
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      setMsg("寫入中...");
      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          target.row = res.row;
          setMsg("已寫入第 " + res.row + " 列 ✔");
        })
        .withFailureHandler(e => { btn.disabled = false; setMsg("寫入失敗：" + e.message, true); })
        .saveItemPicker(target, summaryText());
    }

    function setMsg(text, isError) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.style.color = isError ? "#c62828" : "#2e7d32";
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    load();
  </script>
</body>
</html>
